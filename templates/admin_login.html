{% extends "base.html" %}

{% block title %}Admin sign in | AURA STUDIOS{% endblock %}

{% block content %}
<div class="page">
  <div class="container">
    <div class="panel login-card">
      <h1 class="title" style="font-size:22px;margin-bottom:4px">Admin sign in</h1>
      <p class="muted" style="font-size:14px;margin-bottom:18px">Manage products and orders.</p>
      <form onsubmit="handleAdminLogin(event)" novalidate>
        <label class="field"><span>Email</span><input class="input" type="email" id="adminEmail" autocomplete="username" inputmode="email" required></label>
        <label class="field"><span>Password</span><input class="input" type="password" id="adminPassword" autocomplete="current-password" required></label>
        <div class="form-msg" id="adminMsg" role="alert"></div>
        <button type="submit" id="adminLoginBtn" class="btn btn-block">Sign in</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
  async function handleAdminLogin(e) {
    e.preventDefault();
    const btn = document.getElementById('adminLoginBtn'), msg = document.getElementById('adminMsg');
    msg.textContent = ''; btn.disabled = true;
    try {
      const res = await fetch('/api/auth/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: document.getElementById('adminEmail').value.trim(), password: document.getElementById('adminPassword').value })
      });
      const data = await res.json();
      if (data.success && data.user.role === 'admin') { location.href = '/admin'; return; }
      msg.textContent = data.success ? 'This account does not have admin access.' : (data.error || 'Sign in failed.');
    } catch (err) { msg.textContent = 'Network error. Please try again.'; }
    btn.disabled = false;
  }
</script>
{% endblock %}
